apiVersion: v1
kind: Service
metadata:
  name: postgres-headless-service
  labels:
    app: postgres
  namespace: converter
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    name: postgres
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: converter
spec:
  serviceName: "postgres-headless-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mixed-secret
              key: db-pass
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: mixed-secret
              key: db-user
        - name: POSTGRES_DB
          value: emoji_bot
        volumeMounts:
        - name: postgres-data-volume
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data-volume
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: "local-path"
      resources:
        requests:
          storage: 1Gi
