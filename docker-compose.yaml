services:
  converter:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - tg-net
    depends_on:
      converter-database:
        condition: service_healthy

  converter-database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: emoji_bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - tg-net

volumes:
  db-data:

networks:
  tg-net:
    driver: bridge